<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800">
  <defs>
    <linearGradient id="page" x1="90" y1="20" x2="1190" y2="780" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fbfafd"/>
      <stop offset="1" stop-color="#eee9f7"/>
    </linearGradient>
    <linearGradient id="brand" x1="70" y1="46" x2="1210" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#241842"/>
      <stop offset="1" stop-color="#5e3fb0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#2d204c" flood-opacity=".14"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="url(#page)"/>
  <rect width="1280" height="210" fill="url(#brand)"/>
  <circle cx="1150" cy="30" r="190" fill="#d9ccff" opacity=".08"/>
  <g transform="translate(176 64)">
    <rect width="78" height="78" rx="20" fill="#5e3fb0" stroke="#d9ccff" stroke-opacity=".35"/>
    <text x="13" y="56" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="43" font-weight="760" letter-spacing="-4">G</text>
    <text x="45" y="56" fill="#d9ccff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="42" font-weight="760" letter-spacing="-3">V</text>
  </g>
  <text x="276" y="82" fill="#d9ccff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="1.8">CASUAL VISUAL PRIVACY</text>
  <text x="276" y="126" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="44" font-weight="760" letter-spacing="-2">Welcome to Glance<tspan fill="#d9ccff">Veil</tspan></text>
  <text x="276" y="158" fill="#e6defa" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="17">Choose a readable veil in one minute. Everything stays on this device.</text>

  <g filter="url(#shadow)">
    <rect x="176" y="185" width="928" height="560" rx="20" fill="#fff" stroke="#cfc3e6"/>
    <line x1="216" y1="275" x2="1064" y2="275" stroke="#e2dbea"/>
    <g font-family="Inter, ui-sans-serif, system-ui, sans-serif">
      <circle cx="250" cy="232" r="15" fill="#5e3fb0"/>
      <text x="250" y="237" text-anchor="middle" fill="#fff" font-size="12" font-weight="800">1</text>
      <text x="276" y="237" fill="#211b35" font-size="13" font-weight="750">Choose a script</text>
      <circle cx="506" cy="232" r="15" fill="#e9e1fb"/>
      <text x="506" y="237" text-anchor="middle" fill="#5e3fb0" font-size="12" font-weight="800">2</text>
      <text x="532" y="237" fill="#6e6681" font-size="13" font-weight="750">Set reading strength</text>
      <circle cx="790" cy="232" r="15" fill="#e9e1fb"/>
      <text x="790" y="237" text-anchor="middle" fill="#5e3fb0" font-size="12" font-weight="800">3</text>
      <text x="816" y="237" fill="#6e6681" font-size="13" font-weight="750">Practice peek</text>

      <text x="222" y="316" fill="#5e3fb0" font-size="10" font-weight="800" letter-spacing="1.5">START WITH WHAT FEELS FAMILIAR</text>
      <text x="222" y="350" fill="#211b35" font-size="24" font-weight="760">Pick your visual script</text>
      <text x="222" y="378" fill="#6e6681" font-size="14">You can change this later for a tab, a site, or everywhere.</text>

      <text x="222" y="417" fill="#6e6681" font-size="11" font-weight="700">SCRIPT</text>
      <rect x="222" y="427" width="254" height="44" rx="9" fill="#fff" stroke="#bfaedc"/>
      <text x="239" y="455" fill="#211b35" font-size="14">Greek</text>
      <text x="456" y="455" fill="#6e6681" font-size="14">⌄</text>
      <text x="497" y="417" fill="#6e6681" font-size="11" font-weight="700">READING STRENGTH</text>
      <rect x="497" y="427" width="254" height="44" rx="9" fill="#fff" stroke="#d8cfe6"/>
      <text x="514" y="455" fill="#211b35" font-size="14">Dense</text>
      <text x="731" y="455" fill="#6e6681" font-size="14">⌄</text>
      <text x="772" y="417" fill="#6e6681" font-size="11" font-weight="700">ACTIVATION</text>
      <rect x="772" y="427" width="286" height="44" rx="9" fill="#fff" stroke="#d8cfe6"/>
      <text x="789" y="455" fill="#211b35" font-size="14">All supported sites</text>
      <text x="1038" y="455" fill="#6e6681" font-size="14">⌄</text>

      <rect x="222" y="500" width="836" height="112" rx="13" fill="#2b2143"/>
      <text x="244" y="528" fill="#cdbef4" font-size="11" font-weight="750">LIVE PREVIEW · GREEK DENSE</text>
      <text x="244" y="568" fill="#fff" font-size="25">Γουρ παγεσ ρεμαιν ρεαδαμπλε το γου,</text>
      <text x="244" y="598" fill="#fff" font-size="25">μπυτ χαρδερ το σκαν ατ α γλανκε.</text>

      <rect x="222" y="642" width="222" height="46" rx="9" fill="#5e3fb0"/>
      <text x="333" y="671" text-anchor="middle" fill="#fff" font-size="13" font-weight="750">Continue</text>
      <text x="466" y="671" fill="#6e6681" font-size="12">No account · No telemetry · Not encryption</text>
    </g>
  </g>
</svg>

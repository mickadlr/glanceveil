name: Bug report
description: Report a reproducible Kalima problem using synthetic content.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not paste private page, note, form, or terminal content. Use a synthetic example. Security issues belong in GitHub private vulnerability reporting.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Browser extension
        - Google Docs
        - Obsidian desktop
        - Obsidian mobile
        - tmux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kalima version
      placeholder: 2.2.1
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser or host version, operating system, and device type.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use only synthetic content.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private page, note, form, and terminal content from this report.
          required: true
